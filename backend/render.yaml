# Primary deployment: Render API + Vercel UI + external Supabase PostgreSQL.
# Set the Blueprint path to backend/render.yaml. start.sh handles migrations.
services:
  - type: web
    name: postcraft-backend
    runtime: docker
    rootDir: backend
    dockerfilePath: ./Dockerfile
    dockerContext: .
    plan: starter
    region: oregon
    healthCheckPath: /api/health
    autoDeployTrigger: commit
    envVars:
      - key: ENVIRONMENT
        value: production
      - key: DEBUG
        value: "False"
      - key: DATABASE_URL
        sync: false
      - key: DATABASE_SSL
        value: "True"
      - key: JWT_SECRET_KEY
        generateValue: true
      - key: RESUME_ENCRYPTION_KEY
        generateValue: true
      - key: GEMINI_API_KEY
        sync: false
      - key: GEMINI_MODEL
        value: gemini-3.5-flash-lite
      - key: GEMINI_FAST_MODEL
        value: gemini-3.5-flash-lite
      - key: GEMINI_DRAFT_MODEL
        value: gemini-3.5-flash-lite
      - key: SERP_API_KEY
        sync: false
      - key: TAVILY_API_KEY
        sync: false
      - key: CHROMA_PERSIST_DIR
        value: /var/data/chroma
      - key: ALLOWED_HOSTS
        value: postcraft-ai-3p2x.onrender.com,postcraft-backend.onrender.com
      - key: CORS_ORIGINS
        value: https://post-craft-ai-lemon.vercel.app
      - key: SENTRY_DSN
        sync: false
    disk:
      name: chroma-disk
      mountPath: /var/data
      sizeGB: 1
