[project]
name = "postcraft-backend"
version = "0.1.0"
description = "FastAPI backend for PostCraft AI"
requires-python = ">=3.11"
dependencies = [
    "fastapi",
    "uvicorn[standard]",
    "sqlalchemy[asyncio]",
    "asyncpg",
    "alembic",
    "pydantic",
    "pydantic-settings",
    "python-dotenv",
    "httpx",
    "chromadb>=0.4.24",
    "google-genai>=0.1.2",
    "langgraph>=1.2.0",
    "langchain-google-genai>=2.1.0,<3.0.0",
    "passlib[argon2]>=1.7.4",
    "python-jose[cryptography]>=3.3.0",
    "python-multipart>=0.0.9",
    "pdfplumber>=0.11.0",
    "docx2txt>=0.8",
    "slowapi>=0.1.9",
    "sentry-sdk[fastapi]>=2.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest",
    "pytest-asyncio",
    "httpx"
]
