
services:
  # ─── PostgreSQL ────────────────────────────────────────
  postgres:
    image: postgres:16-alpine
    container_name: postcraft-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?POSTGRES_USER must be set in the environment}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set in the environment}
      POSTGRES_DB: ${POSTGRES_DB:?POSTGRES_DB must be set in the environment}
    # No ports exposed — backend reaches postgres via internal Docker network (postgres:5432).
    # Only expose port if you need host access for debugging (remember to firewall it).
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER}"]
      interval: 5s
      timeout: 5s
      retries: 5

  # ─── ChromaDB ──────────────────────────────────────────
  chromadb:
    image: chromadb/chroma:1.5.9
    container_name: postcraft-chromadb
    restart: unless-stopped
    # No public ports — only backend reaches this on the internal Docker network.
    volumes:
      - chroma_data:/data
    environment:
      - IS_PERSISTENT=TRUE
      - ANONYMIZED_TELEMETRY=FALSE

  # ─── FastAPI Backend ───────────────────────────────────
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: postcraft-backend
    restart: unless-stopped
    # No public ports — only Caddy reaches this on the internal Docker network.
    env_file:
      - ./backend/.env
    environment:
      - DATABASE_SSL=False
      - ENVIRONMENT=production
      - DATABASE_URL=postgresql+asyncpg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      - CHROMA_HOST=chromadb
      - CHROMA_PORT=8000
      - ALLOWED_HOSTS=${ALLOWED_HOSTS:-localhost,127.0.0.1,postcraft-backend}
    # Do NOT use `command:` here — it overrides the Dockerfile CMD which runs
    # start.sh (alembic migrations + resume encryption). Without it, the DB
    # schema is never applied on startup.
    # The Dockerfile CMD ["start.sh"] handles everything.
    depends_on:
      postgres:
        condition: service_healthy

  # ─── Next.js Frontend ──────────────────────────────────
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        # NEXT_PUBLIC_API_URL is baked in at build time. Leave empty so the
        # frontend uses same-origin /api/* and Caddy proxies to the backend.
        # Override with NEXT_PUBLIC_API_URL=https://your-domain.com for prod.
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-}
    container_name: postcraft-frontend
    restart: unless-stopped
    # No public ports — only Caddy reaches this on the internal Docker network.
    depends_on:
      - backend

  # ─── Caddy (TLS termination) ───────────────────────────
  # Handles automatic Let's Encrypt cert issuance and renewal.
  # This is the only service that should be publicly accessible (80 + 443).
  caddy:
    image: caddy:2-alpine
    container_name: postcraft-caddy
    restart: unless-stopped
    ports:
      - "80:80"   # HTTP — redirects to HTTPS via Caddy's auto_https
      - "443:443" # HTTPS
    volumes:
      - ./frontend/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data    # Cert storage
      - caddy_config:/config
    environment:
      # POSTCRAFT_DOMAIN defaults to localhost for dev. In production, set this to your real domain
      # (e.g. app.yourdomain.com) and POSTCRAFT_ADMIN_EMAIL for Let's Encrypt notifications.
      - POSTCRAFT_DOMAIN=${POSTCRAFT_DOMAIN:-localhost}
      - POSTCRAFT_ADMIN_EMAIL=${POSTCRAFT_ADMIN_EMAIL:-admin@localhost}
    depends_on:
      - backend
      - frontend

volumes:
  postgres_data:
  chroma_data:
  caddy_data:
  caddy_config:
